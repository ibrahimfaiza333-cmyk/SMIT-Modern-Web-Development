<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>

<body>
    <center>




        <h1> Creating a Table </h1>
        
        <table border="1" bgcolor="skyblue" width="70%" cellpadding="10" >
            <tr>
                <th colspan="6">Time Table</th>
            </tr>
            <tr>
            <th rowspan="6">hours</th>
            <th align="center">mon</th>
            <th>tue</th>
            <th>wed</th>
            <th>thurs</th>
            <th>fri</th>
        </tr>

        <tr>
            <td>science</td>
            <td>maths</td>
            <td>science</td>
            <td  align="start">maths</td>
            <td>arts</td>
        </tr>
        
        <tr>
            <td>science</td>
            <td>maths</td>
            <td>science</td>
            <td>maths</td>
            <td>arts</td>
        </tr>

        <tr>
            <th colspan="5">LUNCH</th>
        </tr>
        
        <tr>
            <td>science</td>
            <td>maths</td>
            <td>science</td>
            <td>maths</td>
            <td rowspan="2">projects</td>
        </tr>

        
        <tr>
            <td>science</td>
            <td>maths</td>
            <td>science</td>
            <td>maths</td>
        </tr>
    </table>
</center>
</body>

</html>
