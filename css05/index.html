<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<body>

    <!-- FIXED ELEMENT (kept outside container) -->
    <div class="card boxfixed">
        <h3>Element D – Fixed</h3>
        <p>Stays on screen<br>position: fixed;</p>
    </div>

    <div class="main-container">

        <h1>CSS Position Playground</h1>

        <!-- STATIC -->
        <div class="card boxstatic">
            <h3>Element A – Static</h3>
            <p>Default Flow<br>position: static;</p>
        </div>

        <!-- RELATIVE -->
        <div class="card boxrelative">
            <h3>Element B – Relative</h3>
            <p>Shifted 20px<br>position: relative;</p>
        </div>

        <!-- ABSOLUTE -->
        <div class="card boxabsolute">
            <h3>Element C – Absolute</h3>
            <p>Top Right<br>position: absolute;</p>
        </div>

        <!-- STICKY -->
        <div class="card boxsticky">
            <h3>Element E – Sticky</h3>
            <p>Stick on scroll<br>position: sticky;</p>
        </div>

        <p style="margin-top: 600px"></p>

    </div>

</body>

</body>
</html>
